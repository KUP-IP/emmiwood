name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Exact-artifact browser gate
        run: npm run test:e2e:isolated
      - name: Brand source and artifact contract
        run: npm run test:brand && node scripts/brand-assets-check.mjs .deploy/pages/static
      - name: Firefox and WebKit critical-flow smoke
        run: npm run test:e2e:cross-browser
      - name: Safe-live read-only contract
        run: npm run test:e2e:live:contract
      - name: Migration rehearsal
        run: ./scripts/verify-migrations.sh
      - name: Release safety tests
        run: npm run test:release
      - name: Root dependency audit
        run: npm audit --audit-level=high
      - name: Client dependency audit
        run: npm audit --prefix client --audit-level=high
      - name: Preserve browser and artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmiwood-release-evidence
          path: |
            playwright-report/
            test-results/
            .deploy/pages/artifact-manifest.json
          retention-days: 14

  deploy:
    name: Deploy production Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'KUP-IP/emmiwood' && vars.EMMIWOOD_CLOUD_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Production build
        run: npm run build
      - name: Deploy Direct Upload production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy client/dist --project-name emmiwood --branch main --commit-hash "${{ github.sha }}"
