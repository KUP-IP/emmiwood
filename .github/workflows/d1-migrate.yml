name: D1 remote migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: D1 database to migrate
        type: choice
        required: true
        options:
          - preview
          - production
      confirm:
        description: Type APPLY-REMOTE-MIGRATIONS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: d1-migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply remote D1 migrations (${{ inputs.target }})
    if: github.repository == 'KUP-IP/emmiwood'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 10
    steps:
      - name: Require confirmation phrase
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "APPLY-REMOTE-MIGRATIONS" ]; then
            echo "Refusing remote migrate without exact confirmation phrase APPLY-REMOTE-MIGRATIONS"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Apply preview migrations
        if: inputs.target == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote:preview
      - name: Apply production migrations
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote:production
