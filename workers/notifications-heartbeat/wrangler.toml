name = "emmiwood-notifications-heartbeat"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

[vars]
EMMIWOOD_NOTIFICATION_URL = "https://emmiwood.com/api/emmiwood/internal/notifications"
PROCESS_QUEUE = "false"      # flipped to "true" only on Isaiah's GO (step 3.4)
EXPECT_TEST_MODE = "false"

[triggers]
crons = ["*/5 * * * *"]
